# Renta fija argentina: parámetros del análisis + términos de cada instrumento.
#
# Convenciones:
# - Todos los flujos son por 100 VN ORIGINALES (así cotiza BYMA) y el precio también es por 100 VN.
# - `fuente` dice de dónde salen los términos y `confianza` cuánto confiamos:
#     alta  = prospecto/decreto + cronograma cruzado entre fuentes independientes + TIR validada contra el mercado.
#     media = una fuente pública secundaria (repo open source / API) y validado contra precios o reportes.
#     baja  = calibrado (p.ej. base CER despejada de la TIR real publicada). Revisar contra el prospecto.
# - Lecaps/Boncaps que no estén acá se completan solas con api.argentinadatos.com (pago final derivado de precio y TEA).
# - Duales TAMAR/CER, dollar linked, DICP/PARP/CUAP: NO se incluyen (términos con opcionalidad o capitalización
#   que no pudimos verificar de forma confiable).

parametros:
  plazo_liquidacion: 1              # T+1 hábil (BYMA, 24hs)
  rezago_cer_habiles: 10            # el CER que aplica es el de 10 días hábiles antes de la liquidación/pago
  inflacion_esperada_mensual: 0.018 # supuesto por defecto (pisar con REM/expectativas al llamar)
  devaluacion_esperada_mensual: 0.012
  dias_min_curva: 20                # instrumentos con menos días al vencimiento no entran al ajuste de curva
  min_puntos_ns: 5                  # con menos puntos se ajusta curva logarítmica en vez de Nelson-Siegel
  rico_barato_pb: 50                # |spread vs curva| mayor a esto -> "barato" / "caro"
  score:
    pesos: {rendimiento: 0.40, valor_relativo: 0.35, liquidez: 0.25}
    spread_saturacion_pb: 150       # spread que satura el componente de valor relativo (0 o 100)
    volumen_ref_ars: 5.0e+9         # volumen efectivo diario (ARS) que da liquidez 100
    volumen_min_ars: 1.0e+6         # debajo de esto liquidez 0
  # Filtro de calidad (src/renta_fija/calidad.py): lo que no pasa queda con score_rf vacío y NO se compra.
  calidad:
    tir_rango: {usd: [-0.05, 0.30], nominal_ars: [0.0, 1.50], real_cer: [-0.20, 0.40]}
    dias_min_compra: 20             # lo que vence antes no se compra (TIR ruidosa, cerca del corte de negociación)
    volumen_min_compra_ars: 2.0e+7  # volumen efectivo diario mínimo
    spread_puntas_max: 0.03         # (ask-bid)/medio de la especie en pesos
    spread_curva_max_pb: 400        # más lejos de la curva que esto = dato dudoso
    confianza_excluida: [baja]      # bases CER calibradas: error de ~2% en precio (±300 pb de TIR en 6 meses)
    exigir_operado_hoy: true        # data912 repite el último cierre aunque no opere: sin volumen = precio viejo
    dias_corte_cupon: 5             # días corridos antes de un pago: el cupón ya puede estar cortado (ex-cupón)
  cache_ttl_min: 20                 # las cotizaciones del día se vuelven a pedir si el caché tiene más de esto
  fuentes:
    data912: https://data912.com
    argentinadatos: https://api.argentinadatos.com
    bcra_cer: https://api.bcra.gob.ar/estadisticas/v4.0/monetarias/30
  timeout_s: 20

