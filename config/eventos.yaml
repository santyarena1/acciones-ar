# Calendario de eventos de alto impacto (lo usa src/analysis/eventos.py).
# Solo fechas con fuente. Lo dudoso NO se carga:
#   - Revisiones del FMI: las fechas dependen del directorio del FMI y no se publican con anticipación fija.
#   - PASO 2027: la ley fija el segundo domingo de agosto, pero en 2025 se suspendieron y hay proyectos para
#     eliminarlas. Cargar cuando se confirme la convocatoria.
#   - Reuniones de la Fed 2027: el calendario se publica a mediados de 2026; verificar y cargar.
# reduccion_ar: fracción de la exposición argentina (acciones + bonos en dólares) que se baja durante la ventana
#   [fecha - dias_antes, fecha + dias_despues]. 0 = solo aviso. Solo actúa con tactico.eventos.aplicar: true.
#   Estudio 2007-2025 (19 elecciones nacionales, canasta de ADRs argentinos): en las 4 semanas previas la canasta
#   subió +3,4% en promedio y el día después +1,6% (mediana +2%, 7 de 19 negativas; extremos -49% PASO 2019,
#   +35% legislativas 2025). Cubrirse antes de elecciones costó en promedio: es un seguro, no una ganancia.
eventos:
  - nombre: "Elecciones legislativas de EE.UU."
    fecha: 2026-11-03
    tipo: eleccion_eeuu
    region: eeuu
    dias_antes: 14
    reduccion_ar: 0.0
    fuente: "Ley federal de EE.UU.: primer martes después del primer lunes de noviembre"
    confianza: alta
  - nombre: "Reunión de la Fed (tasas)"
    fecha: 2026-10-28
    tipo: fed
