    dias_antes: 7
    reduccion_ar: 0.0
    fuente: "Calendario FOMC 2026 publicado por la Reserva Federal (verificar en federalreserve.gov)"
    confianza: media
    nota: "Antes de las reuniones de la Fed el mercado históricamente subió (no se reduce nada)"
  - nombre: "Reunión de la Fed (tasas)"
    fecha: 2026-12-09
