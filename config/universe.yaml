# Universo de análisis. Tres grupos: panel líder, panel general y CEDEARs.
# Todo lo que no tenga liquidez suficiente (ver settings.yaml -> liquidez) se analiza pero NO recibe compras.
#
# Acciones locales: se analizan con el precio en ARS de BYMA dividido por el CCL.
#   adr / ratio_adr: para fundamentales (yfinance) y para cruzar con el reporte semanal. VERIFICAR ratios.
# CEDEARs: se analizan con el precio en USD del subyacente (más limpio que el CEDEAR en pesos / CCL);
#   las órdenes se arman con el precio en ARS del CEDEAR en BYMA.

